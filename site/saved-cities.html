<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Saved cities – Hourline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Hourline</a>
  </header>
  <div class="page">
    <main class="prose" id="main">
      <h1>Cities saved in this browser</h1>
      <p id="status">Checking this browser…</p>
      <ul id="list"></ul>
      <p><button type="button" class="toggle" id="copy" hidden>Copy list</button></p>
      <p id="copied" role="status"></p>
    </main>
  </div>
  <script>
    (function () {
      var status = document.getElementById("status");
      var list = document.getElementById("list");
      var copy = document.getElementById("copy");
      var copied = document.getElementById("copied");
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem("hourline.cities")); } catch (e) { saved = null; }

      if (!Array.isArray(saved) || !saved.length) {
        status.textContent = "No saved cities were found in this browser. Try opening this page in the browser and device you used when you added them.";
        return;
      }

      var lines = saved.map(function (c) {
        if (typeof c === "string") return c;
        return [c.name, c.region, c.country].filter(Boolean).join(", ") + (c.tz ? " (" + c.tz + ")" : "");
      });
      status.textContent = lines.length + (lines.length === 1 ? " city was" : " cities were") + " saved in this browser:";
      lines.forEach(function (line) {
        var li = document.createElement("li");
        li.textContent = line;
        list.appendChild(li);
      });

      copy.hidden = false;
      copy.addEventListener("click", function () {
        var text = lines.join("\n");
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(function () { copied.textContent = "Copied. Paste the list into your message."; })
          .catch(function () { copied.textContent = "Copying was blocked. Select the list above and copy it instead."; });
      });
    })();
  </script>
</body>
</html>
